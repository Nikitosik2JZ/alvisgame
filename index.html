<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#182b29" />
    <title></title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="loading" role="status"><span class="loading-spinner" aria-hidden="true"></span></div>
    <main id="game" data-i18n-aria-label="html.001"></main>
    <header class="hud">
      <div class="hud-switches">
        <button id="toggle-hud" aria-expanded="true" aria-controls="hud-details" data-i18n-aria-label="hudui.002">▲</button>
        <button id="open-menu" data-i18n-aria-label="html.002">☰</button>
      </div>
      <div id="hud-details">
      <div class="eyebrow"><span data-i18n="html.015"></span></div>
      <h1><span data-i18n="html.016"></span><span class="local-badge"><span data-i18n="html.017"></span></span></h1>
      </div>
      <div class="stats">
        <span><span class="stat-label"><span data-i18n="html.018"></span></span> <strong id="money">0 ₽</strong></span>
        <span><span class="stat-label"><span data-i18n="html.019"></span></span> <strong id="level">1</strong></span>
        <span><span class="stat-label"><span data-i18n="html.020"></span></span> <strong id="reputation">0</strong></span>
        <span id="delivery-streak" hidden data-i18n-aria-label="html.003"></span>
      </div>
      <div id="xp" class="xp"><span data-i18n="html.021"></span></div>
      <nav class="hud-actions" data-i18n-aria-label="html.004">
        <button id="open-shop"><span data-i18n="html.022"></span><small><span data-i18n="html.023"></span></small></button>
        <button id="open-profile"><span data-i18n="html.024"></span><small><span data-i18n="html.025"></span></small></button>
        <button id="open-garage"><span data-i18n="html.026"></span><small><span data-i18n="company-ui.070"></span></small></button>
        <button id="open-events"><span data-i18n="achievements.007"></span><small><span data-i18n="html.027"></span></small></button>
        <button id="open-company"><span data-i18n="achievements.006"></span><small><span data-i18n="html.028"></span></small></button>
        <button id="open-progress"><span data-i18n="html.029"></span><small><span data-i18n="html.030"></span></small></button>
        <button id="open-tasks"><span><span data-i18n="tasks-ui.003"></span></span><small><span data-i18n="html.031"></span></small></button>
        <button id="open-rating"><span data-i18n="rating"></span><small><span data-i18n="html.032"></span></small></button>
      </nav>
      <div id="current-transport" class="xp"></div>
      <div id="transport-goal" class="progression-goal"></div>
    </header>
    <section id="order-panel" class="order-panel" data-i18n-aria-label="html.005">
      <button id="toggle-order" aria-expanded="false" aria-controls="active-order-details" hidden><span data-i18n="order-ui.003"></span></button>
      <strong id="objective" aria-live="polite"></strong>
      <div id="order-offer">
        <p id="offer-restaurant"></p>
        <strong id="offer-reward"></strong>
        <p id="offer-summary"></p>
        <p id="offer-details"></p>
        <button id="accept-order"><span data-i18n="company-events.036"></span></button>
      </div>
      <div id="distance" hidden></div>
      <div id="timer" hidden></div>
      <div id="active-order-details" hidden></div>
      <p id="result" role="status" hidden></p>
      <div id="result-actions" hidden>
        <p id="delivery-ad-bonus"></p>
        <button id="rewarded-delivery"><span data-i18n="watchAd"></span></button>
        <p id="ad-feedback" role="status" aria-live="polite"></p>
      </div>
    </section>
    <button id="interact" class="interact" hidden><span data-i18n="order-ui.027"></span></button>
    <aside class="guide"><span class="status-dot"></span><span data-i18n="html.033"></span></aside>
    <footer class="controls-hint"><kbd>W A S D</kbd><kbd>↑ ← ↓ →</kbd><span><span data-i18n="html.034"></span></span></footer>
    <div id="joystick" class="touch-controls" role="group" data-i18n-aria-label="html.006"><span class="joystick-stick"></span></div>
    <dialog id="menu-dialog" class="progression-dialog menu-dialog" aria-labelledby="menu-title">
      <div class="modal-header"><h2 id="menu-title"><span data-i18n="html.035"></span></h2><button data-close><span data-i18n="html.036"></span></button></div>
      <div class="modal-content" id="menu-actions"></div>
    </dialog>
    <dialog id="rating-dialog" class="progression-dialog" aria-labelledby="rating-title">
      <div class="modal-header"><h2 id="rating-title"><span data-i18n="rating"></span></h2><button data-close><span data-i18n="html.036"></span></button></div>
      <div class="modal-content" id="rating-content"></div>
    </dialog>
    <dialog id="shop-dialog" class="progression-dialog" aria-labelledby="shop-title">
      <div class="modal-header"><h2 id="shop-title"><span data-i18n="html.022"></span></h2><button data-close data-i18n-aria-label="html.007"><span data-i18n="html.036"></span></button></div>
      <div class="modal-content">
        <p id="shop-money"></p>
        <p class="modal-note"><span data-i18n="html.037"></span></p>
        <p class="modal-note"><span data-i18n="html.038"></span></p>
        <p id="shop-feedback" role="status" aria-live="polite"></p>
        <div id="shop-items"></div>
      </div>
    </dialog>
    <dialog id="profile-dialog" class="progression-dialog" aria-labelledby="profile-title">
      <div class="modal-header"><h2 id="profile-title"><span data-i18n="html.024"></span></h2><button data-close data-i18n-aria-label="html.008"><span data-i18n="html.036"></span></button></div>
      <div class="modal-content">
        <dl id="profile-details"></dl>
        <p class="modal-note"><span data-i18n="html.039"></span></p>
        <p class="modal-note"><span data-i18n="html.038"></span></p>
      </div>
    </dialog>
    <dialog id="event-history-dialog" class="progression-dialog" aria-labelledby="event-history-title">
      <div class="modal-header"><h2 id="event-history-title"><span data-i18n="achievements.007"></span></h2><button data-close data-i18n-aria-label="html.009"><span data-i18n="html.036"></span></button></div>
      <div class="modal-content"><p class="modal-note"><span data-i18n="html.040"></span></p><div id="event-history"></div></div>
    </dialog>
    <dialog id="garage-dialog" class="progression-dialog" aria-labelledby="garage-title">
      <div class="modal-header"><h2 id="garage-title"><span data-i18n="html.026"></span></h2><button data-close data-i18n-aria-label="html.010"><span data-i18n="html.036"></span></button></div>
      <div class="modal-content">
        <p id="garage-money"></p>
        <p id="garage-goal" class="goal-card"></p>
        <p class="modal-note"><span data-i18n="html.041"></span></p>
        <p id="garage-feedback" role="status" aria-live="polite"></p>
        <section id="transport-celebration" class="transport-celebration" hidden aria-labelledby="celebration-title">
          <p><span data-i18n="garage-ui.002"></span></p><h2 id="celebration-title"></h2><h3 id="celebration-transport"></h3>
          <p id="celebration-text"></p><p><span data-i18n="html.042"></span></p><button id="celebration-go"><span data-i18n="html.043"></span></button>
        </section>
        <div id="garage-items"></div>
      </div>
    </dialog>
    <dialog id="company-dialog" class="progression-dialog" aria-labelledby="company-title">
      <div class="modal-header"><h2 id="company-title"><span data-i18n="achievements.006"></span></h2><button data-close data-i18n-aria-label="html.011"><span data-i18n="html.036"></span></button></div>
      <div class="modal-content">
        <p id="company-wallet"></p>
        <p id="company-gameplay-note" class="modal-note"><span data-i18n="html.044"></span></p>
        <p id="company-feedback" role="status" aria-live="polite"></p>
        <section id="company-offline" hidden>
          <p class="eyebrow"><span data-i18n="html.045"></span></p><h3><span data-i18n="html.046"></span></h3>
          <p id="company-offline-earned"></p><p id="company-offline-limit" class="modal-note"></p>
          <button id="company-offline-collect"><span data-i18n="tasks-ui.002"></span></button><button id="company-offline-later"><span data-i18n="tasks-ui.014"></span></button>
        </section>
        <section id="company-celebration" hidden>
          <p class="eyebrow"><span data-i18n="html.047"></span></p><h3><span data-i18n="html.048"></span></h3>
          <p><span data-i18n="html.049"></span></p>
          <button id="company-begin"><span data-i18n="html.050"></span></button>
        </section>
        <form id="company-name-form">
          <label for="company-name"><span data-i18n="html.051"></span></label>
          <div class="company-name-row"><input id="company-name" name="companyName" type="text" autocomplete="organization" enterkeyhint="done" /><button id="company-rename" type="submit" hidden><span data-i18n="html.052"></span></button></div>
          <small id="company-name-hint"></small>
        </form>
        <section id="company-locked">
          <h3><span data-i18n="html.053"></span></h3><p id="company-requirements" class="goal-card"></p>
          <button id="company-open"><span data-i18n="html.054"></span></button>
        </section>
        <div id="company-business" hidden>
          <nav class="company-tabs" data-i18n-aria-label="html.012">
            <button data-company-view="dashboard"><span data-i18n="html.055"></span></button><button data-company-view="employees"><span data-i18n="html.056"></span></button>
            <button data-company-view="vehicles"><span data-i18n="achievements.003"></span></button><button data-company-view="upgrades"><span data-i18n="html.057"></span></button>
          </nav>
          <section data-company-panel="dashboard">
            <h3 id="company-display-name"></h3><dl id="company-summary" class="company-summary"></dl>
            <article class="shop-item company-balance"><h3><span data-i18n="html.058"></span><span id="company-balance"></span></h3><p id="company-storage"></p><button id="company-collect"><span data-i18n="tasks-ui.002"></span></button></article>
            <h3><span data-i18n="html.059"></span></h3><ol id="company-log"></ol>
          </section>
          <section data-company-panel="employees" hidden>
            <h3><span data-i18n="html.056"></span></h3><p id="company-capacity"></p><div id="company-employees" class="company-cards"></div>
            <h3><span data-i18n="html.060"></span></h3><p id="company-hire-status" role="status"></p>
            <div id="company-candidates" class="company-cards"></div><button id="company-refresh"><span data-i18n="html.061"></span></button>
          </section>
          <section data-company-panel="vehicles" hidden><h3><span data-i18n="html.062"></span></h3><p class="modal-note"><span data-i18n="html.063"></span></p><div id="company-vehicles" class="company-cards"></div></section>
          <section data-company-panel="upgrades" hidden><h3><span data-i18n="html.064"></span></h3><article class="shop-item"><h3 id="company-upgrade-title"></h3><p id="company-upgrade-details"></p><button id="company-upgrade"><span data-i18n="html.065"></span></button></article><h3><span data-i18n="html.066"></span></h3><div id="company-upgrades" class="company-cards"></div></section>
        </div>
      </div>
    </dialog>
    <dialog id="progress-dialog" class="progression-dialog" aria-labelledby="progress-heading">
      <div class="modal-header"><h2 id="progress-heading"><span data-i18n="html.029"></span></h2><button data-close><span data-i18n="html.036"></span></button></div>
      <div class="modal-content">
        <p id="progress-summary" class="goal-card"></p>
        <nav class="company-tabs" data-i18n-aria-label="html.013">
          <button data-progress-view="career"><span data-i18n="html.067"></span></button><button data-progress-view="achievements"><span data-i18n="html.068"></span></button>
          <button data-progress-view="records"><span data-i18n="html.069"></span></button><button data-progress-view="legacy"><span data-i18n="html.070"></span></button>
        </nav>
        <p id="progress-feedback" role="status" aria-live="polite"></p>
        <section id="magnate-celebration" hidden>
          <h3><span data-i18n="html.071"></span></h3>
          <p><span data-i18n="html.072"></span></p>
          <p><span data-i18n="html.073"></span></p>
          <button id="magnate-continue"><span data-i18n="continue"></span></button>
        </section>
        <div id="progress-content"></div>
      </div>
    </dialog>
    <dialog id="tasks-dialog" class="progression-dialog" aria-labelledby="tasks-heading">
      <div class="modal-header"><h2 id="tasks-heading"><span data-i18n="tasks-ui.003"></span></h2><button data-close><span data-i18n="html.036"></span></button></div>
      <div class="modal-content">
        <nav class="company-tabs" data-i18n-aria-label="html.014">
          <button data-task-view="daily"><span data-i18n="html.074"></span></button><button data-task-view="challenges"><span data-i18n="html.075"></span></button><button data-task-view="streak"><span data-i18n="html.076"></span></button>
        </nav>
        <p id="tasks-feedback" role="status" aria-live="polite"></p><div id="tasks-content"></div>
      </div>
    </dialog>
    <aside id="task-toast" role="status" aria-live="polite" hidden></aside>
    <aside id="achievement-toast" role="status" aria-live="polite" hidden></aside>
    <aside id="transport-milestone" role="status" aria-live="polite" hidden></aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

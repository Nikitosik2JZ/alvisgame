<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#182b29" />
    <title>Courier Empire · Курьерская Империя</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="game" aria-label="Courier Empire city"></main>
    <header class="hud">
      <div class="eyebrow">КУРЬЕРСКАЯ ИМПЕРИЯ</div>
      <h1>Courier Empire<span class="local-badge">LOCAL</span></h1>
      <div class="stats">
        <span>Деньги: <strong id="money">0 ₽</strong></span>
        <span>Уровень: <strong id="level">1</strong></span>
        <span>Репутация: <strong id="reputation">0</strong></span>
      </div>
      <div id="xp" class="xp">0 / 100 XP</div>
    </header>
    <section id="order-panel" class="order-panel" aria-label="Текущий заказ">
      <strong id="objective" aria-live="polite"></strong>
      <div id="order-offer">
        <p id="offer-restaurant"></p>
        <p id="offer-details"></p>
        <button id="accept-order">ПРИНЯТЬ</button>
      </div>
      <div id="distance" hidden></div>
      <div id="timer" hidden></div>
      <p id="result" role="status" hidden></p>
    </section>
    <button id="interact" class="interact" hidden>ЗАБРАТЬ ЗАКАЗ · E</button>
    <aside class="guide"><span class="status-dot"></span> Следуйте к маркеру заказа</aside>
    <footer class="controls-hint"><kbd>W A S D</kbd><kbd>↑ ← ↓ →</kbd><span>Движение · E — действие</span></footer>
    <nav class="touch-controls" aria-label="Movement controls">
      <button data-direction="up" aria-label="Walk up">↑</button>
      <button data-direction="left" aria-label="Walk left">←</button>
      <button data-direction="down" aria-label="Walk down">↓</button>
      <button data-direction="right" aria-label="Walk right">→</button>
    </nav>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
